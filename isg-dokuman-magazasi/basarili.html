<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ödeme Başarılı | İSG Doküman Marketi</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .success-card {
      max-width: 650px;
      margin: 60px auto;
      padding: 40px 30px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .success-icon {
      width: 70px;
      height: 70px;
      background: #dcfce7;
      color: #16a34a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 20px auto;
    }
    .download-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid #e2e8f0;
      text-align: left;
    }
    .download-btn {
      background: #16a34a;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
    }
    .download-btn:hover {
      background: #15803d;
    }
  </style>
</head>
<body style="background: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">

  <div class="success-card">
    <div class="success-icon">✓</div>
    <h1 style="color: #0f172a; margin-bottom: 10px; font-size: 24px;">Ödemeniz Başarıyla Alındó!</h1>
    <p style="color: #64748b; font-size: 15px; line-height: 1.6; margin-bottom: 25px;">
      Siparişiniz onaylandı. Satın aldığınız düzenlenebilir şablonları aşağıdan hemen indirebilirsiniz:
    </p>

    <!-- İndirilebilir Ürünler Listesi -->
    <div id="purchasedFilesList">
      <p style="color: #64748b;">Şablonlar yükleniyor...</p>
    </div>

    <div style="margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 20px; font-size: 13px; color: #94a3b8;">
      Bilgilendirme e-postası kayıtlı adresinize gönderilmiştir.<br>
      <a href="index.html" style="color: #0284c7; text-decoration: none; margin-top: 10px; display: inline-block;">← Ana Sayfaya Dön</a>
    </div>
  </div>

  <script>
    // LocalStorage veya URL'den son alınan sepet/ürün bilgilerini okuyup listeleme
    document.addEventListener('DOMContentLoaded', () => {
      const listContainer = document.getElementById('purchasedFilesList');
      
      // Örnek olarak test amaçlı sepet verisini okuyalım veya mock gösterelim
      // Gerçek yapıda PayTR dönüşünde sepet verisi aktarılır
      let purchasedItems = [];
      try {
        purchasedItems = JSON.parse(localStorage.getItem('lastPurchasedCart')) || [
          { title: 'Saha Denetim Raporu Şablonu', format: 'Word', file_url: '#' },
          { title: 'Risk Değerlendirme Takip Tablosu', format: 'Excel', file_url: '#' }
        ];
      } catch(e) {
        purchasedItems = [];
      }

      if (purchasedItems.length === 0) {
        listContainer.innerHTML = `<p style="color: #64748b;">İndirilecek şablon bulunamadı.</p>`;
        return;
      }

      listContainer.innerHTML = purchasedItems.map(item => `
        <div class="download-item">
          <div>
            <b style="display: block; color: #0f172a; font-size: 15px;">${item.title || item.name}</b>
            <small style="color: #64748b;">Format: ${item.format || 'Word / Excel'}</small>
          </div>
          <a href="${item.file_url || '#'}" class="download-btn" target="_blank" onclick="alert('İndirme başlatılıyor!')">📥 İndir</a>
        </div>
      `).join('');
    });
  </script>

</body>
</html>
