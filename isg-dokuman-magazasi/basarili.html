<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ödeme Başarılı | İSG Doküman Marketi</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .success-card {
      max-width: 650px;
      margin: 60px auto;
      padding: 40px 30px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .success-icon {
      width: 70px;
      height: 70px;
      background: #dcfce7;
      color: #16a34a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 20px auto;
    }
    .download-list {
      margin: 25px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .download-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      text-align: left;
    }
    .download-btn {
      background: #0284c7;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .download-btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body style="background: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">

  <div class="success-card">
    <div class="success-icon">✓</div>
    <h1 style="color: #0f172a; margin-bottom: 8px; font-size: 24px;">Ödemeniz Başarıyla Tamamlandı!</h1>
    <p style="color: #64748b; font-size: 15px; line-height: 1.5;">
      Siparişiniz onaylandı. Satın aldığınız şablon(lar) aşağıda listelenmiştir. Hemen indirebilirsiniz.
    </p>

    <!-- İndirilebilir Ürünler Listesi -->
    <div class="download-list" id="purchasedFilesList">
      <p style="color: #64748b;">Dokümanlarınız hazırlanıyor...</p>
    </div>

    <div style="margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 20px; font-size: 13px; color: #94a3b8;">
      Ödeme onayınız alındı. E-posta adresiniz: <strong id="userEmailDisplay" style="color: #334155;">-</strong><br>
      <a href="index.html" style="color: #0284c7; text-decoration: none; margin-top: 12px; display: inline-block; font-weight: 600;">← Ana Sayfaya Dön</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const listContainer = document.getElementById('purchasedFilesList');
      const emailDisplay = document.getElementById('userEmailDisplay');
      
      const storedEmail = localStorage.getItem('customerEmail');
      if (storedEmail && emailDisplay) {
        emailDisplay.textContent = storedEmail;
      }

      let purchasedItems = [];
      try {
        purchasedItems = JSON.parse(localStorage.getItem('lastPurchasedCart')) || [];
      } catch(e) {
        purchasedItems = [];
      }

      if (purchasedItems.length === 0) {
        listContainer.innerHTML = `
          <div style="padding: 20px; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 8px; color: #9f1239; font-size: 14px;">
            Hafızada henüz tamamlanmış ürün bulunamadı. Lütfen ana sayfaya dönüp sepetinizi kontrol edin.
          </div>
        `;
        return;
      }

      listContainer.innerHTML = purchasedItems.map(item => {
        // Supabase'den gelen gerçek dosya linki veya güvenli indirme bağlantısı
        const downloadUrl = item.file_url || item.download_url || '#';
        const title = item.title || item.name || 'İSG Doküman Şablonu';
        const format = item.format || 'Word / Excel';

        return `
          <div class="download-item">
            <div>
              <b style="display: block; color: #0f172a; font-size: 15px; margin-bottom: 2px;">${title}</b>
              <small style="color: #64748b;">Format: ${format}</small>
            </div>
            <a href="${downloadUrl}" class="download-btn" ${downloadUrl !== '#' ? 'download target="_blank"' : 'onclick="alert(\'Doküman indirmesi başlatıldı.\'); return false;"'}>
              <span>📥</span> İndir
            </a>
          </div>
        `;
      }).join('');
    });
  </script>

</body>
</html>
