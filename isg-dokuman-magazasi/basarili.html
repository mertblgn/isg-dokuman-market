<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ödeme Başarılı | İSG Doküman Marketi</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .success-card {
      max-width: 600px;
      margin: 80px auto;
      padding: 40px 30px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .success-icon {
      width: 70px;
      height: 70px;
      background: #dcfce7;
      color: #16a34a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 20px auto;
    }
    .download-btn {
      display: inline-block;
      background: #0284c7;
      color: white;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      margin-top: 20px;
      transition: background 0.2s;
    }
    .download-btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body style="background: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">

  <div class="success-card">
    <div class="success-icon">✓</div>
    <h1 style="color: #0f172a; margin-bottom: 10px; font-size: 24px;">Ödemeniz Başarıyla Alındı!</h1>
    <p style="color: #64748b; font-size: 15px; line-height: 1.6;">
      Siparişiniz için teşekkür ederiz. Satın aldığınız İSG dokümanlarını aşağıdaki buton üzerinden hemen indirebilirsiniz.
    </p>

    <!-- Örnek İndirme Bağlantısı -->
    <a href="#" id="downloadLink" class="download-btn" onclick="alert('Doküman indirme başlatılıyor...'); return false;">
      📥 Dokümanı Hemen İndir (PDF / Word)
    </a>

    <div style="margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 20px; font-size: 13px; color: #94a3b8;">
      Bir kopya da kayıtlı e-posta adresinize referans olarak iletilmiştir.<br>
      <a href="index.html" style="color: #0284c7; text-decoration: none; margin-top: 10px; display: inline-block;">← Ana Sayfaya Dön</a>
    </div>
  </div>

</body>
</html>
